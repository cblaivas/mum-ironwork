    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : "none"} stroke={filled ? "none" : color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} {...rest}>
        {children}
      </svg>
    );
  };
}

function usePS(key, opts) {
  opts = opts || {};
  return function (init) {
    const today = nowAU().toDateString();
    const wk = nowAU().getFullYear() + "-" + weekNumber();
    const [val, setVal] = useState(() => {
      try {
        const raw = localStorage.getItem("iwm_" + key);
        if (!raw) return init;
        const p = JSON.parse(raw);
        let v = p.v;
        if (opts.reset === "day" && p.d !== today) v = opts.fresh ? opts.fresh(v) : init;
        if (opts.reset === "week" && p.w !== wk) v = opts.fresh ? opts.fresh(v) : init;
        return v;
      } catch (e) {
        return init;
      }
    });
    useEffect(() => {
      try {
        localStorage.setItem("iwm_" + key, JSON.stringify({ d: today, w: wk, v: val }));
      } catch (e) {}
    }, [val]);
    return [val, setVal];
  };
}

function filterExercises(list, location, equipKeys, maxDumbbell) {
  return list.filter((ex) => {
    if (location === "gym") return ex.location === "gym" || ex.location === "both";
    if (ex.equip.length === 0) return ex.location === "home" || ex.location === "both";
    const hasEquip = ex.equip.some((e) => equipKeys.includes(e));
    if (!hasEquip) return false;
    if (ex.equip.includes("dumbbells") && maxDumbbell !== null && maxDumbbell < 5) return false;
    return ex.location === "home" || ex.location === "both";
  });
}

function getExercisesForDay(dayKey, location, equipKeys, maxDumbbell, difficulty = "intermediate", variant = 0) {
  if (dayKey === "rest") return [];
  const slots = DAY_SLOTS[dayKey];
  if (!slots) return filterExercises(EX[dayKey] || [], location, equipKeys, maxDumbbell).slice(0, 7);
  const n =
    location === "gym"
      ? difficulty === "beginner" ? 5 : difficulty === "advanced" ? 9 : 7
      : difficulty === "beginner" ? 5 : difficulty === "advanced" ? 8 : 6;
  const used = {};
  const out = [];
  for (const t of slots) {
    if (out.length >= n) break;
    const pool = filterExercises(ALL_EX.filter((e) => e.t === t), location, equipKeys, maxDumbbell);
    if (!pool.length) continue;
    const occ = used[t] || 0;
    const ex = pool[(occ + variant * 2) % pool.length];
    used[t] = occ + 1;
    if (out.some((o) => o.name === ex.name)) continue;
    out.push(ex);
  }
  return out;
}

function adjustSets(setsStr, difficulty) {
  if (difficulty === "intermediate") return setsStr;
  const m = setsStr.match(/^(\d+)x(.+)$/);
  if (!m) return setsStr;
  const rest = m[2];
  let sets = parseInt(m[1], 10);
  sets = difficulty === "beginner" ? Math.max(2, sets - 1) : sets + 1;
  return `${sets}x${rest}`;
}

function calcTDEE({ sex, age, height, weight, activity }) {
  const bmr =
    sex === "male"
      ? 10 * weight + 6.25 * height - 5 * age + 5
      : 10 * weight + 6.25 * height - 5 * age - 161;
  const factors = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, athlete: 1.9 };
  return Math.round(bmr * (factors[activity] || 1.2));
}

const TZ = "Australia/Sydney"; // Terrigal / Central Coast NSW
function nowAU() {
  const parts = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric", hour12: false }).formatToParts(new Date());
  const g = (t) => +parts.find((x) => x.type === t).value;
  return new Date(g("year"), g("month") - 1, g("day"), g("hour") % 24, g("minute"), g("second"));
}

function todayIndex() {
  const d = nowAU().getDay(); // 0 = Sunday
  return (d + 6) % 7; // 0 = Monday ... 6 = Sunday
}

function weekNumber() {
  const d = nowAU();
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.floor((d - start) / (7 * 24 * 60 * 60 * 1000));
}

function greetingWord() {
  const h = nowAU().getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}

  if (/plate front/.test(n)) return "plate";
  const e = equip || [];
  if (e.includes("dumbbells")) return "dumbbell";
  if (e.includes("barbell")) return "barbell";
  if (e.includes("kettlebell")) return "kettlebell";
  if (e.includes("bands")) return "band";

}

/* ---------------- Suggested weights from your Gear ---------------- */
const TAG_F = { sside: 0.55, srear: 0.5, strap: 0.8, bi: 0.6, tri: 0.6, fore: 0.5, cfly: 0.6, cupper: 0.85, abs: 0.5, obl: 0.5, hamcurl: 0.7, quadiso: 0.7 };
function weightHint(ex, inv, diff, loc) {
  if (!ex || loc !== "home") return null;
  const f = ({ beginner: 0.5, intermediate: 0.7, advanced: 0.85 }[diff] || 0.7) * (TAG_F[ex.t] || 1);
  const wOf = (types) => inv.filter((i) => types.includes(i.type)).map((i) => +i.weight || 0).filter((w) => w > 0);
  const pick = (list, target) => {
    const u = [...new Set(list)].sort((a, b) => a - b);
    if (!u.length) return null;
    const ok = u.filter((w) => w <= target);
    return ok.length ? ok[ok.length - 1] : u[0];
  };
  const n = ex.name.toLowerCase();
  const kind = equipKind(ex.name, ex.equip);
  if (/weighted push-up/.test(n)) { const w = pick(wOf(["vest"]), Math.max(...wOf(["vest"]), 0) * f); return w ? `${w} kg vest` : null; }
  if (/ankle-weight|weighted glute/.test(n)) { const w = pick(wOf(["anklewt"]), Math.max(...wOf(["anklewt"]), 0) * f); return w ? `${w} kg ankle weights` : null; }
  if (kind === "dumbbell" || kind === "kettlebell") {
    const base = wOf([kind === "dumbbell" ? "dumbbell" : "kettlebell"]);
    const adj = kind === "dumbbell" ? Math.max(0, ...wOf(["adjustable"])) : 0;
    const max = Math.max(0, ...base, adj);
    if (!max) return null;
    const list = adj ? [...base, Math.min(adj, Math.max(2.5, Math.round((max * f) / 2.5) * 2.5))] : base;
    const w = pick(list, max * f);
    const single = /goblet|pullover|squat|swing|deadlift|farmer|press.*kettlebell|kettlebell/.test(n) || kind === "kettlebell";
    return `${w} kg${single ? "" : " in each hand"}`;
  }
  if (kind === "barbell") {
    const type = /ez/.test(n) ? "ezbar" : /trap/.test(n) ? "trapbar" : "barbell";
    const bars = wOf([type]);
    if (!bars.length) return null;
    const bar = Math.max(...bars);
    const plates = wOf(["plates"]);
    const maxTotal = bar + 2 * plates.reduce((t, w) => t + w, 0);
    let sums = [0];
    plates.forEach((w) => { sums = [...new Set([...sums, ...sums.map((x) => x + w)])]; });
    const tgt = (maxTotal * f * 0.8 - bar) / 2;
    const per = Math.max(0, ...sums.filter((x) => x <= tgt));
    return per > 0 ? `${bar} kg bar + ${per} kg each side (${bar + 2 * per} kg total)` : `empty ${bar} kg bar`;
  }
  if (kind === "plate") { const w = pick(wOf(["plates"]), Math.max(...wOf(["plates"]), 0) * f); return w ? `${w} kg plate` : null; }
  return null;
}

function patternFor(name) {
  const n = name.toLowerCase();
  if (/leg curl|hamstring curl|nordic/.test(n)) return "legcurl";
  if (/leg extension/.test(n)) return "legext";
  if (/overhead press|shoulder press|arnold|push press|pike|landmine press|kettlebell press/.test(n)) return "press";
  if (/lateral raise|upright row|front raise|y raise/.test(n)) return "lateral";
  if (/curl/.test(n)) return "curl";
  if (/pushdown|triceps extension|kickback|skull|dumbbell extension/.test(n)) return "triext";
  if (/push-up/.test(n)) return "pushup";
  if (/bench press|chest press|floor press|decline press|incline.*press/.test(n)) return "bench";
  if (/squat|goblet|hack/.test(n) && !/split|sissy|wall/.test(n)) return "squat";
  if (/deadlift|rdl|romanian|good morning|pull-through|swing|back extension/.test(n)) return "hinge";
  if (/rows?\b/.test(n)) return "row";
  if (/pulldown|pull-up|chin-up/.test(n)) return "vpull";
  if (/leg raise|knee raise/.test(n)) return "legraise";
  if (/plank/.test(n) && !/side/.test(n)) return "plank";
  if (/crunch|sit-up|dead bug|hollow/.test(n)) return "crunch";
  return "generic";
}
function Stick({ pat, frame, eq }) {

  const mv = (o, a, L) => [o[0] + L * Math.sin((a * Math.PI) / 180), o[1] - L * Math.cos((a * Math.PI) / 180)];
  const hip = [0, 0], sh = mv(hip, p[0], 24), el = mv(sh, p[1], 12), ha = mv(el, p[2], 12);
  const kn = mv(hip, p[3], 15), ft = mv(kn, p[4], 15), hd = mv(sh, p[0], 10);
  const pts = [hip, sh, el, ha, kn, ft, hd];
  const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);
  const dx = 50 - (Math.min(...xs) + Math.max(...xs)) / 2;
  const dy = HANG[pat] ? 14 - Math.min(...ys) : 86 - Math.max(...ys);
  const T = (q) => [q[0] + dx, q[1] + dy];
  const [H, S, E, A, K, F, D] = pts.map(T);
  const ln = (a, b, c = "#F5F6F7", w = 4) => <line x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke={c} strokeWidth={w} strokeLinecap="round" />;
  return (
    <svg viewBox="0 0 100 100" width="100%" style={{ background: "#14161C", borderRadius: 12 }}>
      {!HANG[pat] && <line x1="6" y1="88" x2="94" y2="88" stroke="#3A3F4B" strokeWidth="2" />}
      {LYING[pat] && <rect x={Math.min(S[0], H[0]) - 4} y={H[1] + 4} width={Math.abs(H[0] - S[0]) + 14} height="4" rx="2" fill="#3A3F4B" />}
      {HANG[pat] && <line x1={A[0] - 18} y1={A[1]} x2={A[0] + 18} y2={A[1]} stroke="#9095A0" strokeWidth="3" strokeLinecap="round" />}
      {ln(H, K)}{ln(K, F)}{ln(H, S, "#22D3EE", 5)}{ln(S, E, "#8B5CF6")}{ln(E, A, "#8B5CF6")}
      <circle cx={D[0]} cy={D[1]} r="5" fill="#F5F6F7" />
      {eq === "cable" && <line x1={A[0]} y1={A[1]} x2={A[0] + 12} y2="6" stroke="#9095A0" strokeWidth="1.5" strokeDasharray="3 2" />}
      {eq === "dumbbell" && <g><rect x={A[0] - 6} y={A[1] - 1.5} width="12" height="3" fill="#9095A0" /><rect x={A[0] - 7} y={A[1] - 5} width="3.5" height="10" rx="1" fill="#FBBF24" /><rect x={A[0] + 3.5} y={A[1] - 5} width="3.5" height="10" rx="1" fill="#FBBF24" /></g>}
      {(eq === "barbell" || eq === "plate") && <circle cx={A[0]} cy={A[1]} r="7" fill="none" stroke="#FBBF24" strokeWidth="3" />}
      {eq === "kettlebell" && <circle cx={A[0]} cy={A[1] + 5} r="5" fill="#FBBF24" />}
      <circle cx={A[0]} cy={A[1]} r="2.5" fill="#FF6B5B" />
    </svg>
  );
}

function BackupCard() {
  const [code, setCode] = useState("");
  const [msg, setMsg] = useState("");
  const make = () => {
    try {
      const o = {};
      Object.keys(localStorage).filter((k) => k.startsWith("iwm_")).forEach((k) => (o[k] = localStorage.getItem(k)));
      const c = btoa(unescape(encodeURIComponent(JSON.stringify(o))));
      setCode(c);
      setMsg("Code ready — copy it and keep it somewhere safe (Notes).");
      if (navigator.clipboard) navigator.clipboard.writeText(c).then(() => setMsg("Copied! Keep it somewhere safe (Notes)."), () => {});
    } catch (e) { setMsg("Backup only works in the installed app."); }
  };
  const restore = () => {
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      Object.keys(o).forEach((k) => k.startsWith("iwm_") && localStorage.setItem(k, o[k]));
      setMsg("Restored! Reloading…");
      setTimeout(() => location.reload(), 800);
    } catch (e) { setMsg("That code didn't work — paste the whole thing."); }
  };
  const b = { background: "rgba(139,92,246,0.18)", border: "1px solid #8B5CF6", borderRadius: 10, color: "#C4B5FD", fontSize: 13, fontWeight: 700, padding: "9px 14px", cursor: "pointer" };
  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 4 }}>Back up your progress</div>
      <p style={{ fontSize: 12, color: "#9095A0", margin: "0 0 10px" }}>
        Your XP and levels are saved on this phone. Always open Ironweek from the home-screen icon (Safari and the icon keep separate saves). Make a backup code to restore them on a new phone or if they ever disappear.
      </p>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <button onClick={make} style={b}>Make backup code</button>
        <button onClick={restore} style={b}>Restore from code</button>
      </div>
      <textarea value={code} onChange={(e) => setCode(e.target.value)} placeholder="Backup code appears here — or paste one to restore" rows={3} style={{ width: "100%", boxSizing: "border-box", background: "#14161C", color: "#F5F6F7", border: "1px solid #2B2F38", borderRadius: 10, padding: 8, fontSize: 11 }} />
      {msg && <div style={{ fontSize: 12, color: "#FBBF24", marginTop: 6 }}>{msg}</div>}
    </Card>
  );
}

function characterState(level, streak, fatLevel) {
  const muscle = Math.min(1, Math.log(Math.max(1, level)) / Math.log(300));
  const big = Math.max(0, Math.min(1, Math.log(Math.max(1, level / 100)) / Math.log(5))); // late-game growth, level 100 to 500
  const skinny = streak === 0 ? 1 : Math.max(0, 1 - streak / 5);
  const fatness = Math.min(1, fatLevel / 10);
  let caption = "Steady progress — keep it up.";
  let need = "Keep logging workouts and meals to see him change over time.";
  if (fatness > 0.55) {
    caption = "Carrying a bit of extra weight from recent meals.";
    need = "Finish a full workout day to help burn it back off.";
  } else if (skinny > 0.6) {
    caption = "Looking lean and a little low on energy.";
    need = "It's been a while since a workout — get moving to build him back up.";
  } else if (big > 0.5) {
    caption = "Absolutely jacked. A true legend.";
    need = "Keep training and he just keeps getting bigger.";
  } else if (muscle > 0.55) {
    caption = "Built, and getting stronger with every level.";
    need = "Keep training and eating well to keep the gains coming.";
  }
  return { muscle, big, skinny, fatness, caption, need };
}

      <circle cx={cx - shoulderW / 2 - armW / 2 + 5} cy={shoulderY + armLen} r={armW / 2 + 1} fill={skin} />
      <circle cx={cx + shoulderW / 2 + armW / 2 - 5} cy={shoulderY + armLen} r={armW / 2 + 1} fill={skin} />

      {/* torso */}
      {[0, 1, 2, 3].map((i) => {
        const pts = torsoPts.split(" ")[i].split(",");
        return <circle key={`t${i}`} cx={+pts[0]} cy={+pts[1]} r="9" fill={shirt} />;
      })}
      <polygon points={torsoPts} fill={shirt} />
      <ellipse cx={cx - shoulderW / 5} cy={shoulderY + 16} rx={shoulderW / 5} ry="18" fill="#FFFFFF" opacity="0.08" />
      {showAbs && (
        <>
          <path d={`M${cx - 10} ${waistY - 30} Q${cx} ${waistY - 27} ${cx + 10} ${waistY - 30}`} stroke="#00000030" strokeWidth="2" fill="none" strokeLinecap="round" />
          <path d={`M${cx - 10} ${waistY - 18} Q${cx} ${waistY - 15} ${cx + 10} ${waistY - 18}`} stroke="#00000030" strokeWidth="2" fill="none" strokeLinecap="round" />
        </>
      )}
      {fatness > 0.35 && <ellipse cx={cx} cy={waistY - 10} rx={waistW / 2 + fatness * 8} ry="20" fill={shirt} opacity="0.85" />}

      {big > 0.1 && (
        <>
          <polygon points={`${cx - 9},46 ${cx + 9},46 ${cx + shoulderW / 2 - 4},${shoulderY + 2} ${cx - shoulderW / 2 + 4},${shoulderY + 2}`} fill={skin} opacity="0.9" />
          <path d={`M${cx - shoulderW / 4} ${shoulderY + 24} Q${cx} ${shoulderY + 30} ${cx + shoulderW / 4} ${shoulderY + 24}`} stroke="#00000035" strokeWidth="2" fill="none" strokeLinecap="round" />
        </>
      )}
      {big > 0.45 && <path d={`M${cx - shoulderW / 2 + 6} ${shoulderY + 6} L${cx - waistW / 2 + 4} ${waistY - 10} M${cx + shoulderW / 2 - 6} ${shoulderY + 6} L${cx + waistW / 2 - 4} ${waistY - 10}`} stroke="#00000030" strokeWidth="2" fill="none" strokeLinecap="round" />}

      {/* neck + head */}
      <rect x={cx - 9} y="46" width="18" height="14" fill={skin} />
      <circle cx={cx} cy="30" r="22" fill={skin} />
      <path d={`M${cx - 22} 30 A22 22 0 0 1 ${cx + 22} 30 L${cx + 22} 22 A22 22 0 0 0 ${cx - 22} 22 Z`} fill="#2B2019" />
      <circle cx={cx - 8} cy="30" r="2.2" fill="#1E2124" />
      <circle cx={cx + 8} cy="30" r="2.2" fill="#1E2124" />
      <path d={`M${cx - 8} 38 Q${cx} 43 ${cx + 8} 38`} stroke="#8A5A3A" strokeWidth="2" fill="none" strokeLinecap="round" />
      {level >= 6 && <rect x={cx - 20} y="20" width="40" height="6" rx="3" fill="#FF6B5B" />}
    </svg>
  );
}

/* ---------------- Main App ---------------- */

function FitnessTracker() {
  const [accounts, setAccounts] = usePS("accounts", {})([]);
  const [user, setUser] = usePS("user", {})({ name: "Guest", email: "" });
  const [settingsMode, setSettingsMode] = useState("signup");
  const [settingsName, setSettingsName] = useState("");
  const [settingsEmail, setSettingsEmail] = useState("");
  const [settingsPassword, setSettingsPassword] = useState("");
  const [settingsError, setSettingsError] = useState("");
  const [tab, setTab] = useState("home");
  const [selectedDay, setSelectedDay] = useState(todayIndex());
  const [locations, setLocations] = usePS("locations", {})(WEEK.map(() => "home"));
  const [difficulty, setDifficulty] = usePS("difficulty", {})("intermediate");
  const [timerLeft, setTimerLeft] = useState(0);
  const [timerRunning, setTimerRunning] = useState(false);
  const [dayNotes, setDayNotes] = usePS("dayNotes_v2", {reset:"week",fresh:()=>({})})({});
  const [ormW, setOrmW] = useState("");
  const [ormR, setOrmR] = useState("");
  const [bodyLog, setBodyLog] = usePS("bodyLog", {})([]);
  const [bwInput, setBwInput] = useState("");
  const [completed, setCompleted] = usePS("completed_v2", {reset:"week",fresh:()=>({})})({});

  const [inventory, setInventory] = usePS("inventory", {})([
    { id: 1, type: "dumbbell", weight: 3, qty: 2 },
    { id: 2, type: "dumbbell", weight: 5, qty: 2 },
    { id: 3, type: "dumbbell", weight: 8, qty: 2 },
    { id: 4, type: "bands", weight: 0, qty: 1 },
    { id: 5, type: "mat", weight: 0, qty: 1 },
  ]);
  const [newItem, setNewItem] = useState({ type: "dumbbell", weight: null, qty: 1 });

  const [prs, setPrs] = usePS("prs", {})([]);
  const [newPr, setNewPr] = useState({ exercise: "", value: "", day: "Monday" });

  const [xp, setXp] = usePS("xp", {})(0);
  const [streak, setStreak] = usePS("streak", {})(0);
  const [streakDays, setStreakDays] = usePS("streakDays_v2", {reset:"week",fresh:()=>({})})({});
  const [fatLevel, setFatLevel] = usePS("fatLevel", {})(3);
  const addXp = (amount) => setXp((prev) => Math.max(0, prev + amount));
  const level = levelFromXp(xp);
  const xpIntoLevel = xp - xpAtLevel(level);
  const xpNeeded = lvlCost(level);
  const lvlBonus = Math.floor(level / 10); // XP per workout creeps up every 10 levels

  const prevLevelRef = useRef(level);
  const [levelUpFlash, setLevelUpFlash] = useState(false);
  useEffect(() => {
    // one-time: keep everyone's existing level when the XP curve got steeper
    try {
      if (localStorage.getItem("iwm_curve2")) return;
      localStorage.setItem("iwm_curve2", "1");
    } catch (e) { return; }
    const old = Math.floor(xp / 100) + 1;
    prevLevelRef.current = old;
    setXp(xpAtLevel(old) + (xp % 100));
  }, []);
  useEffect(() => {
    if (level > prevLevelRef.current) {
      setLevelUpFlash(true);
      const t = setTimeout(() => setLevelUpFlash(false), 3500);
      prevLevelRef.current = level;
      return () => clearTimeout(t);
    }
    prevLevelRef.current = level;
  }, [level]);

  const charState = characterState(level, streak, fatLevel);

  useEffect(() => {
    if (!timerRunning) return;
    const id = setInterval(() => setTimerLeft((t) => Math.max(0, t - 1)), 1000);
    return () => clearInterval(id);
  }, [timerRunning]);
  useEffect(() => {
    if (timerRunning && timerLeft === 0) setTimerRunning(false);
  }, [timerLeft, timerRunning]);
  const startTimer = (secs) => { setTimerLeft(secs); setTimerRunning(true); };
  const fmtTime = (t) => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
  const orm = ormW && ormR ? Math.round(parseFloat(ormW) * (1 + parseInt(ormR, 10) / 30) * 10) / 10 : null;

  const [profile, setProfile] = usePS("profile", {})({ sex: "female", age: 30, height: 165, weight: 65, activity: "moderate" });
  const goalCalories = useMemo(() => calcTDEE(profile), [profile]);
  const [log, setLog] = usePS("log", {reset:"day",fresh:()=>[]})([]);
  const [foodName, setFoodName] = useState("");
  const [foodCals, setFoodCals] = useState("");

  const [mealInput, setMealInput] = useState("");
  const [mealImage, setMealImage] = useState(null);
  const [mealImageType, setMealImageType] = useState("image/jpeg");
  const [mealLoading, setMealLoading] = useState(false);
  const [mealResult, setMealResult] = useState("");
  const [mealError, setMealError] = useState("");
  const fileInputRef = useRef(null);

  const [habits, setHabits] = usePS("habits", {reset:"day",fresh:(l)=>l.map((h)=>({...h,done:false,value:0,counted:false}))})([
    { id: 1, name: "Read", type: "check", points: 10, done: false },
    { id: 2, name: "Brush teeth", type: "check", points: 5, done: false },
    { id: 3, name: "Drink water", type: "count", unit: "glasses", target: 8, points: 15, value: 0, counted: false },
    { id: 4, name: "Sleep", type: "count", unit: "hours", target: 8, points: 20, value: 0, counted: false },
  ]);
  const [newHabit, setNewHabit] = useState({ name: "", type: "check", target: "", unit: "", points: 10 });

  const equipKeys = useMemo(() => {
    const keys = new Set();
    inventory.forEach((it) => {
      if (it.type === "dumbbell") keys.add("dumbbells");
      if (it.type === "kettlebell") keys.add("kettlebell");
      if (it.type === "barbell" || it.type === "plates") keys.add("barbell");
      if (it.type === "bands") keys.add("bands");
      if (it.type === "pullupbar") keys.add("pullupbar");
      if (it.type === "bench") keys.add("bench");
      if (it.type === "medicineball") keys.add("medicineball");
      if (it.type === "vest") keys.add("vest");
      if (it.type === "sandbag") keys.add("sandbag");
      if (it.type === "trx") keys.add("trx");
      if (it.type === "abwheel") keys.add("abwheel");
      if (it.type === "jumprope") keys.add("jumprope");
      if (it.type === "mat") keys.add("mat");
      if (it.type === "adjustable") keys.add("dumbbells");
      if (it.type === "ezbar" || it.type === "trapbar") keys.add("barbell");
      if (it.type === "anklewt") keys.add("anklewt");
      if (it.type === "rack") keys.add("rack");
      if (it.type === "dipbar") keys.add("dipbar");
      if (it.type === "treadmill") keys.add("treadmill");
      if (it.type === "bike") keys.add("bike");
      if (it.type === "rower") keys.add("rower");
    });
    return Array.from(keys);
  }, [inventory]);

  const maxDumbbell = useMemo(() => {
    const dbs = inventory.filter((i) => i.type === "dumbbell" || i.type === "adjustable").map((i) => i.weight);
    return dbs.length ? Math.max(...dbs) : 0;
  }, [inventory]);

  const [, setTick] = useState(0);
  useEffect(() => {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    const id = setInterval(() => setTick((t) => t + 1), 30000);
    return () => clearInterval(id);
  }, []);
  const [extras, setExtras] = usePS("extras_v1", {reset:"week",fresh:()=>({})})({});
  const [swaps, setSwaps] = usePS("swaps_v1", {reset:"week",fresh:()=>({})})({});
  const [showOpts, setShowOpts] = useState(false);
  const [howTo, setHowTo] = useState(null);
  const [xpClaimed, setXpClaimed] = usePS("xpClaimed_v1", {reset:"week",fresh:()=>({})})({});
  const [foodView, setFoodView] = useState("week");

  const dayExercisesFor = (idx) => {
    const base = getExercisesForDay(WEEK[idx].key, locations[idx], equipKeys, maxDumbbell, difficulty, idx >= 4 ? 1 : 0).map((ex) => {
      const sw = swaps[`${idx}|${ex.name}`];
      const rep = sw && ALL_EX.find((e) => e.name === sw);
      return rep ? { ...rep, base: ex.name } : { ...ex, base: ex.name };
    });
    const have = new Set(base.map((e) => e.name));
    const add = (extras[idx] || [])
      .map((n) => ALL_EX.find((e) => e.name === n))
      .filter((e) => e && !have.has(e.name))
      .map((e) => ({ ...e, extra: true }));
    return [...base, ...add];
  };

  const swapExercise = (dayIdx, ex) => {
    const pool = filterExercises(ALL_EX.filter((e) => e.t === ex.t), locations[dayIdx], equipKeys, maxDumbbell);
    const cur = dayExercisesFor(dayIdx).map((e) => e.name);
    const start = Math.max(0, pool.findIndex((e) => e.name === ex.name));
    for (let i = 1; i <= pool.length; i++) {
      const cand = pool[(start + i) % pool.length];
      if (!cur.includes(cand.name)) {
        setSwaps((prev) => ({ ...prev, [`${dayIdx}|${ex.base}`]: cand.name }));
        return;
      }
    }
  };
  const addExtra = (dayIdx, name) => setExtras((prev) => ({ ...prev, [dayIdx]: [...(prev[dayIdx] || []), name] }));
  const removeExtra = (dayIdx, name) => setExtras((prev) => ({ ...prev, [dayIdx]: (prev[dayIdx] || []).filter((n) => n !== name) }));

  const quote = QUOTES[nowAU().getDay() % QUOTES.length];
  const mealPlan = MEAL_PLANS[weekNumber() % MEAL_PLANS.length];
  const tIdx = todayIndex();
  const isPastDay = selectedDay < tIdx;
  const viewedDate = useMemo(() => {
    const d = nowAU();
    d.setDate(d.getDate() + (selectedDay - tIdx));
    return d;
  }, [selectedDay, tIdx]);
  const viewedDateLabel = viewedDate.toLocaleDateString("en-AU", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const dayRelativeLabel = selectedDay === tIdx ? "Today" : selectedDay < tIdx ? "History · read-only" : "Upcoming";
  const habitsDoneToday = habits.filter((h) => (h.type === "check" ? h.done : h.counted)).length;
  const badges = [
    { name: "First rep", ok: Object.values(completed).some(Boolean), icon: Check, color: "#34D399" },
    { name: "3-day streak", ok: streak >= 3, icon: Flame, color: "#FF6B5B" },
    { name: "Level 5", ok: level >= 5, icon: Trophy, color: "#FBBF24" },
    { name: "Level 10", ok: level >= 10, icon: Trophy, color: "#F472B6" },
    { name: "PR hunter", ok: prs.length >= 3, icon: Dumbbell, color: "#8B5CF6" },
    { name: "Fuel up", ok: log.length >= 3, icon: Utensils, color: "#FF6B5B" },
    { name: "Habit hero", ok: habits.length > 0 && habitsDoneToday === habits.length, icon: ListChecks, color: "#F472B6" },
    { name: "Gear head", ok: inventory.length >= 5, icon: Settings2, color: "#22D3EE" },
  ];

  const setDayLocation = (idx, loc) => setLocations((prev) => prev.map((l, i) => (i === idx ? loc : l)));

  const toggleDone = (dayIdx, name) => {
    const k = `${dayIdx}-${name}`;
    const currentlyDone = !!completed[k];
    const willBeDone = !currentlyDone;
    const exs = dayExercisesFor(dayIdx);
    const isDone = (exName) => (exName === name ? currentlyDone : !!completed[`${dayIdx}-${exName}`]);
    const willBeDoneFn = (exName) => (exName === name ? willBeDone : !!completed[`${dayIdx}-${exName}`]);
    const wasFull = exs.length > 0 && exs.every((ex) => isDone(ex.name));
    const isFullNow = exs.length > 0 && exs.every((ex) => willBeDoneFn(ex.name));

    setCompleted((prev) => ({ ...prev, [k]: willBeDone }));
    if (willBeDone && !xpClaimed[k]) {
      addXp(10 + lvlBonus);
      setXpClaimed((c) => ({ ...c, [k]: true }));
    }

    if (!wasFull && isFullNow && !streakDays[dayIdx]) {
      setStreak((s) => s + 1);
      setStreakDays((sd) => ({ ...sd, [dayIdx]: true }));
      if (!xpClaimed["day" + dayIdx]) {
        addXp(40 + 2 * lvlBonus);
        setXpClaimed((c) => ({ ...c, ["day" + dayIdx]: true }));
      }
      setFatLevel((f) => Math.max(0, f - 1));
    } else if (wasFull && !isFullNow && streakDays[dayIdx]) {
      setStreak((s) => Math.max(0, s - 1));
      setStreakDays((sd) => {
        const next = { ...sd };
        delete next[dayIdx];
        return next;
      });
    }
  };

  const addInventoryItem = () => {
    const type = EQUIP_TYPES.find((t) => t.key === newItem.type);
    if (type.needsWeight && !newItem.weight) return;
    const weight = type.needsWeight ? +newItem.weight : 0;
    const qty = +newItem.qty || 1;
    setInventory((prev) => {
      const existing = prev.find((i) => i.type === newItem.type && i.weight === weight);
      if (existing) {
        return prev.map((i) => (i.id === existing.id ? { ...i, qty: i.qty + qty } : i));
      }
      return [...prev, { id: Date.now(), type: newItem.type, weight, qty }];
    });
    setNewItem({ type: newItem.type, weight: null, qty: 1 });
  };
  const removeInventoryItem = (id) => setInventory((prev) => prev.filter((i) => i.id !== id));

  const toggleHabit = (id) => {
    const h = habits.find((x) => x.id === id);
    if (!h) return;
    const newDone = !h.done;
    setHabits((prev) => prev.map((x) => (x.id === id ? { ...x, done: newDone } : x)));
    addXp(newDone ? h.points : -h.points);
  };

  const changeHabitValue = (id, delta) => {
    const h = habits.find((x) => x.id === id);
    if (!h) return;
    const newValue = Math.max(0, h.value + delta);
    const wasCounted = h.counted;
    const isCountedNow = newValue >= h.target;
    setHabits((prev) => prev.map((x) => (x.id === id ? { ...x, value: newValue, counted: isCountedNow } : x)));
    if (!wasCounted && isCountedNow) addXp(h.points);
    else if (wasCounted && !isCountedNow) addXp(-h.points);
  };

  const addCustomHabit = () => {
    if (!newHabit.name.trim()) return;
    const points = +newHabit.points || 10;
    if (newHabit.type === "count") {
      if (!newHabit.target) return;
      setHabits((prev) => [
        ...prev,
        { id: Date.now(), name: newHabit.name.trim(), type: "count", unit: newHabit.unit.trim() || "", target: +newHabit.target, points, value: 0, counted: false },
      ]);
    } else {
      setHabits((prev) => [...prev, { id: Date.now(), name: newHabit.name.trim(), type: "check", points, done: false }]);
    }
    setNewHabit({ name: "", type: "check", target: "", unit: "", points: 10 });
  };
  const removeHabit = (id) => setHabits((prev) => prev.filter((h) => h.id !== id));

  const addPr = () => {
    if (!newPr.exercise.trim() || !newPr.value.trim()) return;
    setPrs((prev) => [{ id: Date.now(), ...newPr, date: nowAU().toLocaleDateString("en-AU") }, ...prev]);
    setNewPr({ exercise: "", value: "", day: "Monday" });
    addXp(25);
  };
  const removePr = (id) => setPrs((prev) => prev.filter((p) => p.id !== id));

  const addFood = () => {
    const cals = parseInt(foodCals, 10);
    if (!foodName.trim() || !cals) return;
    setLog((prev) => [...prev, { id: Date.now(), name: foodName.trim(), cals }]);
    const newConsumed = consumed + cals;
    let fatBump = 0;
    if (cals >= 600) fatBump += 1;
    if (newConsumed > goalCalories) fatBump += 0.5;
    if (fatBump > 0) setFatLevel((f) => Math.min(10, f + fatBump));
    setFoodName("");
    setFoodCals("");
    addXp(10);
  };
  const quickAdd = (name, cals) => {
    setLog((prev) => [...prev, { id: Date.now() + Math.random(), name, cals }]);
    let fatBump = 0;
    if (cals >= 600) fatBump += 1;
    if (consumed + cals > goalCalories) fatBump += 0.5;
    if (fatBump > 0) setFatLevel((f) => Math.min(10, f + fatBump));
    addXp(10);
  };
  const removeFood = (id) => {
    setLog((prev) => prev.filter((f) => f.id !== id));
    addXp(-10);
  };
  const consumed = log.reduce((s, f) => s + f.cals, 0);

  const handleImageUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setMealImageType(file.type || "image/jpeg");
    const reader = new FileReader();
    reader.onload = () => setMealImage(String(reader.result).split(",")[1]);
    reader.readAsDataURL(file);
  };

  const generateMeal = async () => {
    if (!mealInput.trim() && !mealImage) {
      setMealError("Describe what you have, or add a photo, first.");
      return;
    }
    setMealLoading(true);
    setMealError("");
    setMealResult("");
    try {
      const content = [];
      if (mealImage) content.push({ type: "image", source: { type: "base64", media_type: mealImageType, data: mealImage } });
      content.push({
        type: "text",
        text: `I have these foods available at home: ${mealInput || "(see photo for ingredients)"}. Suggest one healthy meal that fits a fitness routine, using mostly what I have. Give a short meal name, then clear numbered step-by-step instructions to make it.`,
      });
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content }],
        }),
      });
      const data = await response.json();
      const text = (data.content || []).map((b) => b.text || "").join("\n");
      setMealResult(text || "No recipe came back — try rephrasing what you have.");
    } catch (err) {
      setMealError("Couldn't reach the recipe assistant just now — try again.");
    } finally {
      setMealLoading(false);
    }
  };

  const submitSettings = () => {
    const cleanEmail = settingsEmail.trim().toLowerCase();
    setSettingsError("");
    if (settingsMode === "signup") {
      if (!settingsName.trim() || !cleanEmail || !settingsPassword.trim()) {
        setSettingsError("Fill in every field first.");
        return;
      }
      if (accounts.some((a) => a.email === cleanEmail)) {
        setSettingsError("That email already has an account — log in instead.");
        return;
      }
      const acc = { name: settingsName.trim(), email: cleanEmail, password: settingsPassword };
      setAccounts((prev) => [...prev, acc]);
      setUser(acc);
    } else {
      if (!cleanEmail || !settingsPassword.trim()) {
        setSettingsError("Fill in every field first.");
        return;
      }
      const match = accounts.find((a) => a.email === cleanEmail);
      if (!match) {
        setSettingsError("No account with that email yet — sign up instead.");
        return;
      }
      if (match.password !== settingsPassword) {
        setSettingsError("Wrong password for that account.");
        return;
      }
      setUser(match);
    }
    setSettingsName("");
    setSettingsEmail("");
    setSettingsPassword("");
  };

  const navItems = [
    { key: "home", icon: HomeIcon, color: "#22D3EE" },
    { key: "plan", icon: Dumbbell, color: "#8B5CF6" },
    { key: "habits", icon: ListChecks, color: "#F472B6" },
    { key: "food", icon: Utensils, color: "#FF6B5B" },
    { key: "prs", icon: Trophy, color: "#FBBF24" },
    { key: "gear", icon: Settings2, color: "#34D399" },
  ];

  return (
    <div style={{ fontFamily: "Inter, system-ui, sans-serif", background: "#0B0C10", minHeight: "100vh", color: "#F5F6F7", paddingBottom: 84, paddingTop: "env(safe-area-inset-top)", overflowX: "hidden" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap');
        .disp { font-family: 'Archivo Black', sans-serif; }
        input[type=range] { accent-color: #8B5CF6; }
        ::selection { background: #7C3AED; color: white; }
        select { color-scheme: dark; }
        input, select, textarea, button { min-width: 0; box-sizing: border-box; }
        * { max-width: 100%; }
        @keyframes popIn { 0% { transform: translateY(-12px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
      `}</style>

      {levelUpFlash && (
        <div
          style={{
            position: "fixed",
            top: 14,
            left: "50%",
            transform: "translateX(-50%)",

              {EQUIP_TYPES.find((t) => t.key === newItem.type)?.needsWeight && (
                <>
                  <div style={{ fontSize: 12, color: "#9095A0", marginBottom: 8 }}>2. WHAT WEIGHT?</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
                    {EQUIP_TYPES.find((t) => t.key === newItem.type).weights.map((w) => (
                      <button
                        key={w}
                        onClick={() => setNewItem({ ...newItem, weight: w })}
                        style={{
                          minWidth: 48,
                          padding: "8px 10px",
                          borderRadius: 8,
                          border: newItem.weight === w ? "1px solid #22D3EE" : "1px solid #2B2F38",
                          background: newItem.weight === w ? "rgba(34,211,238,0.15)" : "#1D2028",
                          color: newItem.weight === w ? "#22D3EE" : "#D8DAE0",
                          fontSize: 13,
                          fontWeight: 700,
                          cursor: "pointer",
                        }}
                      >
                        {w}
                      </button>
                    ))}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
                    <span style={{ fontSize: 12, color: "#9095A0" }}>Or type your own (kg):</span>
                    <input
                      type="number"
                      min="0"
                      step="0.5"
                      value={newItem.weight ?? ""}
                      onChange={(e) => setNewItem({ ...newItem, weight: e.target.value === "" ? null : parseFloat(e.target.value) })}
                      placeholder="e.g. 13"
                      style={{ width: 90, padding: 8, background: "#1D2028", border: "1px solid #2B2F38", borderRadius: 8, color: "#F5F6F7" }}
                    />
                  </div>
                </>
              )}

              <div style={{ fontSize: 12, color: "#9095A0", marginBottom: 8 }}>
                {EQUIP_TYPES.find((t) => t.key === newItem.type)?.needsWeight ? "3. HOW MANY?" : "2. HOW MANY?"}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
                <button
                  onClick={() => setNewItem({ ...newItem, qty: Math.max(1, newItem.qty - 1) })}
                  style={{ width: 34, height: 34, borderRadius: 8, border: "1px solid #2B2F38", background: "#1D2028", color: "#F5F6F7", fontSize: 16, cursor: "pointer" }}
                >
                  −
                </button>
                <span className="disp" style={{ fontSize: 18, minWidth: 20, textAlign: "center" }}>{newItem.qty}</span>
                <button
                  onClick={() => setNewItem({ ...newItem, qty: newItem.qty + 1 })}
                  style={{ width: 34, height: 34, borderRadius: 8, border: "1px solid #2B2F38", background: "#1D2028", color: "#F5F6F7", fontSize: 16, cursor: "pointer" }}
                >
                  +
                </button>
              </div>

              <button
                onClick={addInventoryItem}
                style={{ width: "100%", padding: "12px 0", background: "linear-gradient(120deg,#34D399,#22D3EE)", border: "none", borderRadius: 8, color: "#0B0C10", fontWeight: 800, fontSize: 14, cursor: "pointer" }}
              >
                Add to my gear
              </button>
            </Card>

            {inventory.length === 0 ? (
              <p style={{ fontSize: 13, color: "#9095A0" }}>Nothing added yet — home days will default to bodyweight-only exercises.</p>
            ) : (
              inventory.map((item) => (
                <Card key={item.id} style={{ marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", padding: 14 }}>
                  <div style={{ fontSize: 14 }}>
                    <span style={{ fontWeight: 700 }}>{EQUIP_TYPES.find((t) => t.key === item.type)?.label}</span>
                    {item.weight > 0 && <span style={{ color: "#9095A0" }}> · {item.weight}kg</span>}
                    <span style={{ color: "#9095A0" }}> · x{item.qty}</span>
                  </div>
                  <button onClick={() => removeInventoryItem(item.id)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                    <Trash2 size={16} color="#5B6670" />
                  </button>
                </Card>
              ))
            )}

            {maxDumbbell > 0 && (
              <p style={{ fontSize: 12, color: "#5B6670", marginTop: 12 }}>Heaviest dumbbell on file: {maxDumbbell}kg — home exercises are matched to this.</p>
            )}
          </div>
        )}

        {tab === "settings" && (
          <div>
            <BackupCard />
            <h2 className="disp" style={{ fontSize: 16, marginBottom: 6 }}>Account</h2>
            <p style={{ fontSize: 13, color: "#9095A0", marginBottom: 16 }}>
              No sign-in required to use the app — an account just lets you put a name to your dashboard.
            </p>

            <Card style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 12, color: "#9095A0", marginBottom: 6 }}>DISPLAY NAME</div>
              <input
                value={user.name}
                onChange={(e) => setUser({ ...user, name: e.target.value })}
                placeholder="Your name"
                style={{ width: "100%", padding: 10, background: "#1D2028", border: "1px solid #2B2F38", borderRadius: 8, color: "#F5F6F7" }}
              />
            </Card>

            {user.email ? (
              <Card>
                <div style={{ fontSize: 13, color: "#9095A0", marginBottom: 2 }}>Signed in as</div>
                <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>{user.email}</div>
                <button
                  onClick={() => setUser({ name: "Guest", email: "" })}
                  style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "1px solid #333849", color: "#D8DAE0", borderRadius: 8, padding: "9px 14px", fontSize: 13, cursor: "pointer" }}
                >
                  <LogOut size={14} /> Log out to guest
                </button>
              </Card>
            ) : (
              <Card>
                <div style={{ display: "flex", background: "#1D2028", borderRadius: 10, padding: 4, marginBottom: 16 }}>
                  {["signup", "login"].map((m) => (
                    <button
                      key={m}
                      onClick={() => { setSettingsMode(m); setSettingsError(""); }}
                      style={{
                        flex: 1,
                        padding: "9px 0",
                        border: "none",
                        borderRadius: 8,
                        background: settingsMode === m ? "linear-gradient(120deg,#7C3AED,#22D3EE)" : "transparent",
                        color: settingsMode === m ? "#0B0C10" : "#9095A0",
                        fontWeight: 700,
                        fontSize: 13,
                        cursor: "pointer",
                      }}
                    >
                      {m === "signup" ? "Create account" : "Log in"}
                    </button>
                  ))}
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {settingsMode === "signup" && (
                    <Field icon={<UserIcon size={16} color="#9095A0" />} placeholder="Your name" value={settingsName} onChange={(e) => setSettingsName(e.target.value)} />
                  )}
                  <Field icon={<Mail size={16} color="#9095A0" />} placeholder="Email" value={settingsEmail} onChange={(e) => setSettingsEmail(e.target.value)} />
                  <Field icon={<Lock size={16} color="#9095A0" />} placeholder="Password" type="password" value={settingsPassword} onChange={(e) => setSettingsPassword(e.target.value)} />
                </div>

                {settingsError && <p style={{ color: "#FF6B5B", fontSize: 12, marginTop: 10 }}>{settingsError}</p>}

                <button
                  onClick={submitSettings}
                  style={{ width: "100%", marginTop: 14, padding: "12px 0", border: "none", borderRadius: 10, background: "linear-gradient(120deg,#7C3AED,#22D3EE)", color: "#0B0C10", fontWeight: 800, fontSize: 14, cursor: "pointer" }}
                >
                  {settingsMode === "signup" ? "Create account" : "Log in"}
                </button>
                <p style={{ fontSize: 11, color: "#5B6670", marginTop: 12, marginBottom: 0 }}>
                  Accounts are remembered for this session only — log in with the same email to switch back.
                </p>
              </Card>
            )}
          </div>
        )}
      </div>

      {/* bottom nav */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(11,12,16,0.9)", backdropFilter: "blur(10px)", borderTop: "1px solid #262932", paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div style={{ maxWidth: 760, margin: "0 auto", display: "flex" }}>
          {navItems.map(({ key, icon: Icon, color }) => (
            <button
              key={key}
              onClick={() => setTab(key)}
              style={{ flex: 1, background: "none", border: "none", padding: "12px 0 10px", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer" }}
            >
              <Icon size={20} color={tab === key ? color : "#5B6670"} />
              <div style={{ width: 4, height: 4, borderRadius: 2, background: tab === key ? color : "transparent" }} />
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<FitnessTracker />);

</script>
</body>
</html>
